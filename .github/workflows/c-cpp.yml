name: C/C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make
        
    - name: Build
      run: make
      
    - name: Check executable
      run: |
        if [ ! -f "memory_game" ]; then
          echo "Executable 'memory_game' not found!"
          exit 1
        fi 
